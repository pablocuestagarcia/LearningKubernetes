# Prueba del almacenamiento de bloques: un PVC sobre la StorageClass de Longhorn
# montado por un pod que escribe en él.
#
#   kubectl apply -f pvc-and-pod.yaml
#   kubectl exec -it block-tester -- cat /data/hostname.txt
#   kubectl delete -f pvc-and-pod.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: block-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: block-tester
spec:
  # El consumidor es una carga general: corre en un worker normal y Longhorn
  # le adjunta el volumen de bloques por la red. No necesita el taint.
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "hostname > /data/hostname.txt; sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: block-test-pvc
