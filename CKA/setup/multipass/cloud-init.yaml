#cloud-config
# Preparación común de cada nodo (control-plane y workers) para kubeadm + Longhorn.
# Instala containerd, las herramientas de Kubernetes v1.34 y los prerequisitos de
# almacenamiento (open-iscsi para Longhorn, nfs-common para RWX).
write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  - path: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp

runcmd:
  # --- Kernel modules + sysctl ---
  - modprobe overlay
  - modprobe br_netfilter
  - modprobe iscsi_tcp
  - sysctl --system
  # --- Desactivar swap (requisito de kubelet) ---
  - swapoff -a
  - sed -ri '/\sswap\s/s/^/#/' /etc/fstab
  # --- Prerequisitos de almacenamiento ---
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y open-iscsi nfs-common cryptsetup apt-transport-https ca-certificates curl gpg
  - systemctl enable --now iscsid
  # --- containerd (con SystemdCgroup) ---
  - DEBIAN_FRONTEND=noninteractive apt-get install -y containerd
  - mkdir -p /etc/containerd
  - containerd config default | tee /etc/containerd/config.toml >/dev/null
  - sed -ri 's/(SystemdCgroup = )false/\1true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd
  # --- Repos y binarios de Kubernetes v1.34 ---
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - 'echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl
  - systemctl enable --now kubelet
